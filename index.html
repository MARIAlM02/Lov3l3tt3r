<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffdde6;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
}

.heart{
    font-size:180px;
    display:inline-block;
    animation:spin 4s ease-out forwards;
}

@keyframes spin{
    0%{
        transform:rotate(0deg);
    }
    80%{
        transform:rotate(1800deg);
    }
    100%{
        transform:rotate(1980deg);
    }
}

.message{
    opacity:0;
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
    color:#000;
    max-width:700px;
    padding:20px;
    animation:showMessage 2s forwards;
    animation-delay:4s;
}

@keyframes showMessage{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="heart">❤️</div>

    <div class="message">
        I missed you ong.<br><br>

        Play and leave again,<br>
        you gone be gone for good. ❤️<br><br>

        I LOVE YOU ❤️
    </div>
</div>

</body>
</html>
